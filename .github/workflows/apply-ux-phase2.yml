name: Apply IPO detail UX phase

on:
  push:
    branches: [feat/upstox-migration]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/upstox-migration
          fetch-depth: 0

      - name: Diagnose patch targets
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text = Path('src/App.jsx').read_text()
          checks = {}
          checks['IpoCard signature'] = text.count('function IpoCard({ ipo, accounts, onClick, onEdit, onDelete, showActions }) {')
          checks['card action marker'] = text.count('{showActions && (')
          checks['IpoList signature'] = text.count('function IpoList({ ipos, accounts, onOpen, onEdit, onDelete }) {')
          checks['IpoList card props'] = text.count('onEdit={() => onEdit(ipo)} onDelete={() => onDelete(ipo.id)} showActions />')
          checks['detail signature'] = text.count('function IpoDetailSheet({ ipo, accounts, onClose, onEditIpo, onAddApplication, onBulkApply, onBulkStatus, onEditApplication, onDeleteApplication }) {')
          checks['detail conflicts'] = len(re.findall(r'function IpoDetailSheet\(\{.*?const conflicts = panConflicts\(ipo, accounts\);', text, re.S))
          checks['detail old remarks'] = text.count('{ipo.remarks && (')
          checks['detail edit link'] = text.count('Edit IPO details')
          checks['detail sheet close before ApplicationRow'] = text.count('    </Sheet>\n  );\n}\n\nfunction ApplicationRow')
          checks['main IPO delete callback'] = text.count('discard("ipo", gone, gone.company || "Untitled IPO")')
          checks['detail edit callback'] = text.count('onEditIpo={(ipo) => { setIpoDetail(null); setIpoSheet({ ipo }); }}')
          checks['IPO creation remarks field'] = text.count('<Field label="Remarks">')
          Path('docs/ux_patch_diagnostics.md').write_text(
              '# UX patch diagnostics\n\n' + '\n'.join(f'- **{k}**: `{v}`' for k,v in checks.items()) + '\n'
          )
          PY

      - name: Commit diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ux_patch_diagnostics.md
          git commit -m "chore: record UX patch diagnostics"
          git push origin feat/upstox-migration
