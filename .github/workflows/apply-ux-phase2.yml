name: Apply IPO detail UX phase

on:
  push:
    branches: [feat/upstox-migration]

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/upstox-migration
          fetch-depth: 0
      - name: Diagnose
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          t=Path('src/App.jsx').read_text()
          checks={
          'card action regex': r'\n      \{showActions && \(.*?\n      \)\}\n    </div>\n  \);\n\}',
          'card props regex': r'\n\s+onEdit=\{\(ipo\) => onEdit\(ipo\)\} onDelete=\{\(\) => onDelete\(ipo\.id\)\} showActions />',
          'main IPO callback regex': r'\n\s+onEdit=\{\(ipo\) => setIpoSheet\(\{ ipo \}\)\}\n\s+onDelete=\{\(id\) => \{\n\s+const gone = ipos\.find\(\(x\) => x\.id === id\);\n\s+if \(!gone\) return;\n\s+discard\("ipo", gone, gone\.company \|\| "Untitled IPO"\);\n\s+persistIpos\(ipos\.filter\(\(x\) => x\.id !== id\)\);\n\s+\}\}',
          'detail edit callback regex': r'\n\s+onEditIpo=\{\(ipo\) => \{ setIpoDetail\(null\); setIpoSheet\(\{ ipo \}\); \}\}',
          'detail note state regex': r'function IpoDetailSheet\(\{.*?\n  const conflicts = panConflicts\(ipo, accounts\);\n  return \(',
          'detail note UI regex': r'\n      \{ipo\.remarks && \(.*?\n      \}\)\}\n\n      <button onClick=\{\(\) => onEditIpo\(ipo\)\}.*?</button>\n',
          'detail close regex': r'\n    </Sheet>\n  \);\n}\n\nfunction ApplicationRow',
          }
          out=['# Scoped UX transform diagnostics','']
          for k,p in checks.items():
              try: n=len(re.findall(p,t,re.S))
              except Exception as e: n=f'ERROR {e}'
              out.append(f'- **{k}**: `{n}`')
          Path('docs/ux_patch_diagnostics.md').write_text('\n'.join(out)+'\n')
          PY
      - name: Commit diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ux_patch_diagnostics.md
          git commit -m "chore: record scoped UX transform diagnostics"
          git push origin feat/upstox-migration
