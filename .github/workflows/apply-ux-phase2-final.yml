name: Final IPO detail UX implementation

on:
  push:
    branches: [feat/upstox-migration]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/upstox-migration
          fetch-depth: 0
      - name: Apply UX changes
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('src/App.jsx'); t=p.read_text()
          def sub(pattern,repl,label):
              global t
              t,n=re.subn(pattern,repl,t,count=1,flags=re.S)
              if n!=1: raise SystemExit(f'{label}: {n}')
          sub(r'function IpoCard\(\{ ipo, accounts, onClick, onEdit, onDelete, showActions \}\) \{','function IpoCard({ ipo, accounts, onClick }) {','card signature')
          sub(r'\n      \{showActions && \(.*?\n      \)\}\n    </div>\n  \);\n\}','\n    </div>\n  );\n}','card actions')
          sub(r'function IpoList\(\{ ipos, accounts, onOpen, onEdit, onDelete \}\) \{','function IpoList({ ipos, accounts, onOpen }) {','list signature')
          sub(r'\s+onEdit=\{\(ipo\) => onEdit\(ipo\)\}\s+onDelete=\{\(\) => onDelete\(ipo\.id\)\}\s+showActions />',' />','list card actions')
          sub(r'function IpoDetailSheet\(\{ ipo, accounts, onClose, onEditIpo, onAddApplication, onBulkApply, onBulkStatus, onEditApplication, onDeleteApplication \}\) \{','function IpoDetailSheet({ ipo, accounts, onClose, onDeleteIpo, onSaveNote, onAddApplication, onBulkApply, onBulkStatus, onEditApplication, onDeleteApplication }) {','detail signature')
          dm=re.search(r'function IpoDetailSheet\(\{.*?\nfunction ApplicationRow',t,re.S)
          d=dm.group(0) if dm else None
          if d is None: raise SystemExit('detail component')
          d,n=re.subn(r'(const conflicts = panConflicts\(ipo, accounts\);)(\n  return \()',r'''\1\n  const [note, setNote] = useState(() => ipo.remarks || "");\n  const [noteSaved, setNoteSaved] = useState(false);\n  useEffect(() => { setNote(ipo.remarks || ""); setNoteSaved(false); }, [ipo.id, ipo.remarks]);\n  const saveNote = () => { onSaveNote(ipo.id, note); setNoteSaved(true); };\2''',d,count=1,flags=re.S)
          if n!=1: raise SystemExit('detail note state')
          d,n=re.subn(r'\n      \{ipo\.remarks && \(.*?Edit IPO details</button>\n',r'''\n      <div style={{ marginBottom: 16 }}>\n        <SectionLabel>Note</SectionLabel>\n        <textarea value={note} onChange={(e) => { setNote(e.target.value); setNoteSaved(false); }} rows={3} placeholder="Add a personal note about this IPO" aria-label="IPO note" style={{ ...inputStyle, resize: "vertical", marginTop: 6 }} />\n        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 8, marginTop: 6 }}>\n          <span style={{ fontSize: 11, color: COLORS.inkSoft }}>Only this note is editable here.</span>\n          <button onClick={saveNote} style={{ ...chipBase, padding: "6px 10px", color: COLORS.navy, fontWeight: 700 }}>{noteSaved ? "Saved" : "Save note"}</button>\n        </div>\n      </div>\n''',d,count=1,flags=re.S)
          if n!=1: raise SystemExit('detail note UI')
          d,n=re.subn(r'\n    </Sheet>\n  \);\n}\n\nfunction ApplicationRow',r'''\n      <div style={{ marginTop: 20, paddingTop: 14, borderTop: `1px solid ${COLORS.border}` }}>\n        <SectionLabel>IPO actions</SectionLabel>\n        <button onClick={() => { const n=apps.length; const msg=n ? `Delete ${ipo.company || "this IPO"} and its ${n} application${n===1?"":"s"}?` : `Delete ${ipo.company || "this IPO entry"}?`; if(confirm(msg)) onDeleteIpo(ipo.id); }} style={{ width: "100%", marginTop: 6, minHeight: 44, borderRadius: 10, border: `1px solid ${COLORS.red}`, background: COLORS.redSoft, color: COLORS.red, fontSize: 13, fontWeight: 700, cursor: "pointer" }}>Delete IPO</button>\n      </div>\n    </Sheet>\n  );\n}\n\nfunction ApplicationRow''',d,count=1,flags=re.S)
          if n!=1: raise SystemExit('detail delete UI')
          t=t[:dm.start()]+d+t[dm.end():]
          sub(r'\n\s+onEdit=\{\(ipo\) => setIpoSheet\(\{ ipo \}\)\}\n\s+onDelete=\{\(id\) => \{.*?persistIpos\(ipos\.filter\(\(x\) => x\.id !== id\)\);\n\s+\}\}', '', 'main IPO callbacks')
          sub(r'\n\s+onEditIpo=\{\(ipo\) => \{ setIpoDetail\(null\); setIpoSheet\(\{ ipo \}\); \}\}', '', 'detail edit callback')
          sub(r'(\n\s+onClose=\{\(\) => setIpoDetail\(null\)\})',r'''\1\n          onDeleteIpo={(id) => { const gone=ipos.find((x)=>x.id===id); if(!gone)return; discard("ipo",gone,gone.company||"Untitled IPO"); persistIpos(ipos.filter((x)=>x.id!==id)); setIpoDetail(null); }}\n          onSaveNote={(id,noteValue)=>{ persistIpos(ipos.map((i)=>i.id===id?{...i,remarks:noteValue}:i)); }}''','detail callbacks')
          p.write_text(t)
          doc=Path('docs/UX_UI_IMPROVEMENTS.md'); x=doc.read_text()
          x=x.replace('### 10. Immutable IPO metadata\nStatus: **Pending**','### 10. Immutable IPO metadata\nStatus: **Completed in this group**')
          x=x.replace('### 11. Replace IPO edit with Notes\nStatus: **Pending**','### 11. Replace IPO edit with Notes\nStatus: **Completed in this group**')
          x=x.replace('### 12. Move card actions to logical detail/panel location\nStatus: **Pending**','### 12. Move card actions to logical detail/panel location\nStatus: **Completed in this group**')
          if '### IPO detail/actions — completed' not in x: x+='\n\n## Latest completed group\n\n### IPO detail/actions — completed\n\n- IPO cards no longer show edit/delete controls.\n- Existing IPO metadata is no longer user-editable from the UI.\n- IPO detail now provides a personal Note field backed by the existing `remarks` storage field for compatibility.\n- IPO deletion is available from the IPO detail action area.\n- Application edit/delete controls remain unchanged.\n'
          doc.write_text(x)
          PY
          npm ci
          npm run build
          rm -f .github/workflows/apply-ux-phase2.yml .github/workflows/apply-ux-phase2-final.yml docs/ux_patch_diagnostics.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx docs/UX_UI_IMPROVEMENTS.md .github/workflows/apply-ux-phase2.yml .github/workflows/apply-ux-phase2-final.yml docs/ux_patch_diagnostics.md
          git diff --cached --check
          git commit -m "feat: make IPO metadata immutable and add notes"
          git push origin feat/upstox-migration
